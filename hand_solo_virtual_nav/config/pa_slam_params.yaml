slam_toolbox:
  ros__parameters:
    mode: mapping
    use_map_saver: true
    use_scan_matching: true

    # Keyframe / node creation
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    map_update_interval: 5.0

    # Loop closure (real slam_toolbox names; defaults shown where unchanged)
    do_loop_closing: true
    loop_search_maximum_distance: 8.0           # default 3.0. This is what loop_search_max_radius was aiming for
    loop_match_minimum_chain_size: 10           # default
    loop_match_minimum_response_coarse: 0.35    # default. Lower = more loop closures but more false ones
    loop_match_minimum_response_fine: 0.45      # default

    # Frames
    odom_frame: virtual_hand_solo/odom
    map_frame: map
    base_frame: virtual_hand_solo/base_link
    scan_topic: /virtual_hand_solo/scan         # leading slash added

    # Laser range (set max to your lidar's real max range)
    max_laser_range: 20.0
    min_laser_range: 0.05